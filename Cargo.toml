[workspace]
resolver = "2"
members = ["crates/thc", "crates/thc-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MrHuangJser/tradinghub-crawler"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
